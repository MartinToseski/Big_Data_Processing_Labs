{% extends 'base.html' %}

{% block content %}

<h1>Select City</h1>

<div class="row">

{% for city in cities %}

<div class="col-md-4 mb-4">

    <div class="card p-4 shadow-sm text-center">

        <h3>{{ city.name }}</h3>

        <a
            href="/city/{{ city.city_id }}"
            class="btn btn-dark mt-3"
        >
            Open
        </a>

    </div>

</div>

{% endfor %}

</div>

{% endblock %}
