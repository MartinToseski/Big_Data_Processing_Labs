{% extends 'base.html' %}

{% block content %}

<h1>{{ city }}</h1>

<div class="row">

{% for place in places %}

<div class="col-md-4 mb-4">

    <div class="card shadow-sm h-100">

        {% if place.image_path %}

        <img
            src="{{ url_for('static', filename=place.image_path) }}"
            class="card-img-top"
        >

        {% else %}

        <div class="placeholder-image">
            No image
        </div>

        {% endif %}

        <div class="card-body">

            <h4>{{ place.name }}</h4>

            <p>
                Score:
                {{ place.pagerank_score }}
            </p>

            <a
                href="/place/{{ place.place_id }}"
                class="btn btn-dark"
            >
                View
            </a>

        </div>

    </div>

</div>

{% endfor %}

</div>

{% endblock %}
