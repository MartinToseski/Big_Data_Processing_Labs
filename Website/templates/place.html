{% if image %}

<img
    src="{{ url_for('static', filename=image.image_path) }}"
    class="img-fluid rounded shadow"
>

<img
    src="{{ url_for('static', filename=image.palette_path) }}"
    class="img-fluid mt-3"
>

{% else %}

<div class="placeholder-image">
    No image available
</div>

{% endif %}
